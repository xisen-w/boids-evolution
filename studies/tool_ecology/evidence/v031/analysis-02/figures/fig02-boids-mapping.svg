   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="9.8055" y="18.310672" transform="rotate(-0 9.8055 18.310672)">Boids supplies local policy concepts; their cognitive consequences must be measured</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="15.87375" y="38.033157" transform="rotate(-0 15.87375 38.033157)">Physical concept</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="129.14775" y="38.033157" transform="rotate(-0 129.14775 38.033157)">Implemented guidance</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="264.672" y="38.033157" transform="rotate(-0 264.672 38.033157)">Observed quantity / limitation</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #d97932" x="60.37425" y="67.136145" transform="rotate(-0 60.37425 67.136145)">S · Separation</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(133.238273 62.512878)">Avoid redundant construction</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(132.337102 72.37113)">when a useful neighbor exists</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(266.238281 61.811511)">Breadth, duplication, sustained niches</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(258.949805 72.37113)">Guidance cannot enforce complementarity</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #d97932" x="60.37425" y="116.352709" transform="rotate(-0 60.37425 116.352709)">A · Alignment</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(146.722453 111.864794)">Reuse verified useful</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(149.846672 121.677343)">neighbor interfaces</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(265.306641 111.163427)">Correct adoption + return interventions</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(261.227344 121.63164)">A passing tool need not be indispensable</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #d97932" x="60.37425" y="166.44818" transform="rotate(-0 60.37425 166.44818)">C · Cohesion</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(137.558977 160.379991)">Fit recurring service needs</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(128.791008 170.937853)">and recent neighbor capabilities</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(259.783008 160.425694)">Common-panel coverage and persistence</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #d97932" transform="translate(266.034961 170.983556)">Shared demand is externally specified</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="9.8055" y="208.363711" transform="rotate(-0 9.8055 208.363711)">Three rules are bundled in one prompt condition. No force equations, adaptive neighborhoods or individual-rule effects are identified.</text>
   </g>
