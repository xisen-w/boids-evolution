   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="9.8055" y="188.246304" transform="rotate(-0 9.8055 188.246304)">Failure points to distinguish: output mismatch · unused imports · transient narrowing · redundant full libraries</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="9.8055" y="209.00304" transform="rotate(-0 9.8055 209.00304)">Current study measures the stages separately; successful reuse does not by itself establish complementary division of labour.</text>
   </g>
