   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243544" transform="translate(229.34725 57.982869)">Publish + verify</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243544" transform="translate(213.111625 70.039587)">Version + DEV feedback</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243544" transform="translate(321.475375 57.980994)">Next-round adoption</text>
