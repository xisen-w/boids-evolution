   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="7.78275" y="18.73296" transform="rotate(-0 7.78275 18.73296)">a  Communication through immutable executable tools</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243544" transform="translate(17.177875 57.980994)">Local pre-round view</text>
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243544" transform="translate(11.064125 69.247087)">Own history + neighbors</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; fill: #243544" transform="translate(117.86975 57.982869)">Agent builds / repairs</text>
