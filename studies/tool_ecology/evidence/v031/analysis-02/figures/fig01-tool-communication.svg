   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="9.8055" y="94.40856" transform="rotate(-0 9.8055 94.40856)">All views fixed before a round; no same-round access; feedback arrives next round.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #243544" x="7.78275" y="113.003136" transform="rotate(-0 7.78275 113.003136)">b  What each observation establishes</text>
   </g>
   <g id="text_8">
