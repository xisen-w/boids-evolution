[project]
name = "boids-tool-ecology"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["mini-swe-agent==2.4.6", "openai==2.54.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["external", "runs", ".venv"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
